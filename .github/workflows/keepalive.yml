# Supabase 무료 플랜은 7일 동안 접속이 없으면 프로젝트를 일시정지함 → 매일 한 번 DB에 가벼운 조회를 보내 깨워 둠
# 공개(publishable) 키만 사용 · RLS 때문에 데이터는 하나도 읽히지 않음(빈 결과 [])
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            "https://doltciamvnrrysoynbzo.supabase.co/rest/v1/ayo_items?select=id&limit=1" \
            -H "apikey: sb_publishable_tla5mhOH6x6DkFcqBcPeLw_KX4dgCEQ")
          echo "HTTP $code"
          test "$code" = "200"
