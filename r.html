<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체형 분석 리포트 · 아요바디요</title>
<!-- v185 센터가 회원에게 보낸 리포트 공유 링크 (검색엔진 수집 안 함) -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#17223D">
<meta property="og:title" content="체형 분석 리포트가 도착했어요">
<meta property="og:description" content="센터에서 보낸 체형·ROM 측정 결과를 확인해 보세요.">
<meta property="og:image" content="https://ayoajeyo.github.io/posture-check/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root{ --bg:#F3F4F7; --surface:#FFFFFF; --ink:#131B2E; --ink-soft:#5B6478; --navy:#17223D; --gold:#A8844F; --line:#DDE1E9; --good:#1F8A5B; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0D1220; --surface:#141B2D; --ink:#E8ECF4; --ink-soft:#98A2B8; --navy:#2A3A63; --gold:#D2B07A; --line:#262F47; --good:#4CC08A; color-scheme:dark; } }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg);}
  body{color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); line-height:1.6; word-break:keep-all; overflow-wrap:break-word;}
  .wrap{max-width:560px; margin:0 auto;}
  .ctr{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .ctr .lg{flex:0 0 auto; max-width:132px; height:44px; padding:5px 8px; background:#fff; border:1px solid var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .ctr .lg img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
  .ctr .tx{min-width:0;}
  .eyebrow{margin:0; font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--gold);}
  h1{margin:2px 0 0; font-size:20px; line-height:1.3;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .rep{padding:8px;}
  .rep img{display:block; width:100%; height:auto; border-radius:10px; background:var(--bg); min-height:200px;}
  .rep a{display:block;}
  .hint{margin:8px 4px 2px; font-size:12.5px; color:var(--ink-soft); text-align:center;}
  .acts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .acts.one{grid-template-columns:1fr;}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; border-radius:14px; font-size:16px; font-weight:700; text-decoration:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);}
  .btn.pri{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn:active{transform:translateY(1px);}
  .btn.more{margin:0 0 12px; min-height:46px; font-size:15px;}
  .contact{margin:0 0 12px; font-size:14px; color:var(--ink-soft); text-align:center;}
  .note{font-size:12.5px; color:var(--ink-soft); margin:0;}
  .note b{color:var(--ink);}
  .msg{text-align:center; padding:36px 18px;}
  .msg .ic{font-size:40px; line-height:1;}
  .msg h2{font-size:18px; margin:12px 0 6px;}
  .msg p{margin:0; font-size:14px; color:var(--ink-soft);}
  .foot{margin-top:18px; text-align:center; font-size:12px; color:var(--ink-soft);}
  .foot a{color:var(--gold); text-decoration:none; font-weight:700;}
  .sk{height:420px; border-radius:10px; background:linear-gradient(90deg,var(--bg) 0%,var(--line) 50%,var(--bg) 100%); background-size:200% 100%; animation:sk 1.2s linear infinite;}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<main class="wrap">
  <header class="ctr" id="ctr">
    <div class="lg" id="ctrLogo" hidden></div>
    <div class="tx"><p class="eyebrow">BODY REPORT</p><h1 id="ctrName">체형 분석 리포트</h1></div>
  </header>

  <section class="card rep" id="loading"><div class="sk" aria-label="불러오는 중"></div></section>

  <section id="ok" hidden>
    <div class="card rep">
      <a id="repLink" href="#" target="_blank" rel="noopener"><img id="repImg" alt="체형 분석 리포트 이미지"></a>
      <p class="hint">이미지를 누르면 크게 볼 수 있어요 · 길게 눌러 저장할 수 있어요</p>
    </div>
    <div class="acts" id="acts">
      <a class="btn" id="btnTel" href="#" hidden>📞 전화하기</a>
      <a class="btn pri" id="btnBook" href="#" target="_blank" rel="noopener" hidden>📅 예약하기</a>
    </div>
    <p class="contact" id="ctrContact" hidden></p>
    <a class="btn more" id="btnPage" href="#" hidden>🏢 센터 소개 보기</a>
    <div class="card">
      <p class="note">촬영 조건에 따라 달라질 수 있는 <b>스크리닝 참고값</b>이며 진단을 대신하지 않습니다. 궁금한 점은 센터에 문의해 주세요.</p>
      <p class="note" id="expNote" style="margin-top:6px"></p>
    </div>
  </section>

  <section class="card msg" id="gone" hidden>
    <div class="ic">⏳</div>
    <h2 id="goneT">링크 기간이 끝났어요</h2>
    <p id="goneD">리포트를 다시 보려면 센터에 새 링크를 요청해 주세요.</p>
  </section>

  <p class="foot">측정 도구 <a href="https://ayoajeyo.github.io/posture-check/download.html">아요바디요</a> · made by AYOAJEYO</p>
</main>

<script>
(function(){
  "use strict";
  var SB_URL = "https://doltciamvnrrysoynbzo.supabase.co";
  var SB_KEY = "sb_publishable_tla5mhOH6x6DkFcqBcPeLw_KX4dgCEQ";   // 공개 키 (서버 함수 호출용)
  function $(id){ return document.getElementById(id); }
  // v186 전화·예약 버튼 누름 집계 (실패해도 버튼 동작은 그대로)
  function hit(ev){
    try{ fetch(SB_URL + "/functions/v1/share-view", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json", "apikey": SB_KEY }, body: JSON.stringify({ k: k, ev: ev }) }).catch(function(){}); }catch(e){}
  }
  function show(id){ ["loading", "ok", "gone"].forEach(function(x){ $(x).hidden = x !== id; }); }
  function gone(title, desc){ $("goneT").textContent = title; $("goneD").textContent = desc; show("gone"); }
  function ymd(s){ var d = new Date(s); return isNaN(d) ? "" : d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate(); }

  var k = "";
  try{ k = new URLSearchParams(location.search).get("k") || ""; }catch(e){}
  if(!/^[A-Za-z0-9_-]{20,64}$/.test(k)){ gone("링크 주소가 올바르지 않아요", "받은 메시지의 링크를 다시 눌러 주세요."); return; }

  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 15000);
  fetch(SB_URL + "/functions/v1/share-view", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SB_KEY },
    body: JSON.stringify({ k: k }),
    signal: ctl ? ctl.signal : undefined,
    cache: "no-store"
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return { s: r.status, j: j || {} }; });
  }).then(function(res){
    clearTimeout(timer);
    var j = res.j;
    if(res.s === 410 || j.error === "expired"){ gone("링크 기간이 끝났어요", "리포트를 다시 보려면 센터에 새 링크를 요청해 주세요."); return; }
    if(res.s === 404 || j.error === "notfound"){ gone("공유가 중지된 리포트예요", "센터에서 공유를 중지했거나 없는 링크예요. 센터에 문의해 주세요."); return; }
    if(!j.image){ gone("리포트를 불러오지 못했어요", "잠시 뒤 다시 열어 주세요."); return; }

    var c = j.center || {};
    if(c.name){ $("ctrName").textContent = c.name; document.title = c.name + " · 체형 분석 리포트"; }
    if(c.logo && /^data:image\//.test(c.logo)){
      var im = new Image(); im.alt = (c.name || "센터") + " 로고"; im.src = c.logo;
      $("ctrLogo").appendChild(im); $("ctrLogo").hidden = false;
    }
    $("repImg").src = j.image; $("repLink").href = j.image;
    var n = 0;
    if(c.phone){ $("btnTel").href = "tel:" + c.phone; $("btnTel").hidden = false; n++; $("btnTel").addEventListener("click", function(){ hit("call"); }); }
    if(c.book && /^https?:\/\//i.test(c.book)){ $("btnBook").href = c.book; $("btnBook").hidden = false; n++; $("btnBook").addEventListener("click", function(){ hit("book"); }); }
    if(j.page && /^[A-Za-z0-9_-]{8,40}$/.test(j.page)){ $("btnPage").href = "c.html?c=" + encodeURIComponent(j.page); $("btnPage").hidden = false; }
    if(n === 1) $("acts").className = "acts one";
    if(n === 0) $("acts").hidden = true;
    if(c.contact){ $("ctrContact").textContent = c.contact; $("ctrContact").hidden = false; }
    var e = ymd(j.expires_at);
    $("expNote").textContent = e ? "이 링크는 " + e + "까지 볼 수 있어요." : "";
    show("ok");
  }).catch(function(){
    clearTimeout(timer);
    gone("리포트를 불러오지 못했어요", "인터넷 연결을 확인하고 다시 열어 주세요.");
  });
})();
</script>
</body>
</html>
