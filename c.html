<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>센터 소개 · 아요바디요</title>
<!-- v186 센터 소개 페이지: 아요바디요로 측정하는 센터가 직접 공개한 정보 -->
<meta name="theme-color" content="#17223D">
<meta property="og:title" content="측정 기반 체형 관리 센터">
<meta property="og:description" content="체형·관절가동범위를 측정하고 변화를 리포트로 보여주는 센터예요.">
<meta property="og:image" content="https://ayoajeyo.github.io/posture-check/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root{ --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --ink:#131B2E; --ink-soft:#5B6478; --navy:#17223D; --gold:#A8844F; --gold-soft:#F1E9DC; --line:#DDE1E9; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0D1220; --surface:#141B2D; --surface-2:#1C2540; --ink:#E8ECF4; --ink-soft:#98A2B8; --navy:#2A3A63; --gold:#D2B07A; --gold-soft:#2B2618; --line:#262F47; color-scheme:dark; } }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg);}
  body{color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); line-height:1.6; word-break:keep-all; overflow-wrap:break-word;}
  .wrap{max-width:560px; margin:0 auto;}
  .hero{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px 18px; margin-bottom:12px;}
  .lg{display:inline-flex; align-items:center; justify-content:center; max-width:180px; height:54px; padding:6px 10px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:12px;}
  .lg img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
  .kind{display:inline-block; font-size:12px; font-weight:700; color:var(--gold); background:var(--gold-soft); border-radius:100px; padding:3px 10px; margin:0 0 6px;}
  h1{margin:0; font-size:23px; line-height:1.3;}
  .intro{margin:10px 0 0; font-size:15px; color:var(--ink-soft); white-space:pre-line;}
  .acts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .acts.one{grid-template-columns:1fr;}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; border-radius:14px; font-size:16px; font-weight:700; text-decoration:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);}
  .btn.pri{background:var(--navy); color:#fff; border-color:var(--navy);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px;}
  .card h2{margin:0 0 10px; font-size:15px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none;}
  .chips li{font-size:13.5px; font-weight:600; padding:6px 12px; border-radius:100px; background:var(--surface-2);}
  .msr li{display:flex; gap:8px; align-items:center; font-size:14px; padding:4px 0;}
  .msr{margin:0; padding:0; list-style:none;}
  .msr li::before{content:"✓"; color:var(--gold); font-weight:800;}
  .info{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px;}
  .info dt{color:var(--ink-soft); font-weight:600;}
  .info dd{margin:0;}
  .info a{color:var(--gold); font-weight:700; text-decoration:none; margin-left:6px; white-space:nowrap;}
  .note{font-size:12.5px; color:var(--ink-soft); margin:0;}
  .msg{text-align:center; padding:36px 18px;}
  .msg .ic{font-size:40px; line-height:1;}
  .msg h2{font-size:18px; margin:12px 0 6px;}
  .msg p{margin:0; font-size:14px; color:var(--ink-soft);}
  .foot{margin-top:18px; text-align:center; font-size:12px; color:var(--ink-soft);}
  .foot a{color:var(--gold); text-decoration:none; font-weight:700;}
  .sk{height:260px; border-radius:20px; background:linear-gradient(90deg,var(--surface) 0%,var(--line) 50%,var(--surface) 100%); background-size:200% 100%; animation:sk 1.2s linear infinite;}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<main class="wrap">
  <div class="sk" id="loading" aria-label="불러오는 중"></div>

  <section id="ok" hidden>
    <header class="hero">
      <div class="lg" id="logo" hidden></div>
      <p class="kind" id="kind" hidden></p>
      <h1 id="name">센터</h1>
      <p class="intro" id="intro" hidden></p>
    </header>
    <div class="acts" id="acts">
      <a class="btn" id="btnTel" href="#" hidden>📞 전화하기</a>
      <a class="btn pri" id="btnBook" href="#" target="_blank" rel="noopener" hidden>📅 예약하기</a>
    </div>
    <div class="card" id="tagCard" hidden><h2>이런 고민을 함께 관리해요</h2><ul class="chips" id="tags"></ul></div>
    <div class="card"><h2>📏 측정 기반 관리</h2>
      <ul class="msr" id="items"></ul>
      <p class="note" style="margin-top:8px">측정 결과와 변화를 리포트로 받아볼 수 있어요.</p>
    </div>
    <div class="card" id="infoCard" hidden><h2>센터 정보</h2><dl class="info" id="info"></dl></div>
    <div class="card"><p class="note">센터가 직접 등록한 정보예요. 측정 결과는 스크리닝 참고값이며 진단을 대신하지 않습니다.</p></div>
  </section>

  <section class="card msg" id="gone" hidden>
    <div class="ic">🏢</div>
    <h2>센터 소개를 찾을 수 없어요</h2>
    <p id="goneD">센터가 소개 페이지를 비공개로 바꿨거나 없는 주소예요.</p>
  </section>

  <p class="foot">측정 도구 <a href="https://ayoajeyo.github.io/posture-check/download.html">아요바디요</a> · made by AYOAJEYO</p>
</main>

<script>
(function(){
  "use strict";
  var SB_URL = "https://doltciamvnrrysoynbzo.supabase.co";
  var SB_KEY = "sb_publishable_tla5mhOH6x6DkFcqBcPeLw_KX4dgCEQ";   // 공개 키 (서버 함수 호출용)
  var DEF_ITEMS = ["체형 정렬 (정면·측면)", "관절가동범위 (ROM)", "척추 균형 · 거북목"];
  function $(id){ return document.getElementById(id); }
  function show(id){ ["loading", "ok", "gone"].forEach(function(x){ $(x).hidden = x !== id; }); }
  function post(body, keep){
    return fetch(SB_URL + "/functions/v1/share-view", { method: "POST", keepalive: !!keep, cache: "no-store", headers: { "Content-Type": "application/json", "apikey": SB_KEY }, body: JSON.stringify(body) });
  }
  var c = "";
  try{ c = new URLSearchParams(location.search).get("c") || ""; }catch(e){}
  function hit(ev){ try{ post({ c: c, ev: ev }, true).catch(function(){}); }catch(e){} }
  function li(t){ var x = document.createElement("li"); x.textContent = t; return x; }
  if(!/^[A-Za-z0-9_-]{8,40}$/.test(c)){ show("gone"); return; }

  post({ c: c }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return { s: r.status, j: j || {} }; });
  }).then(function(res){
    var p = res.j.profile;
    if(!p){ if(res.s >= 500) $("goneD").textContent = "잠시 뒤 다시 열어 주세요."; show("gone"); return; }
    $("name").textContent = p.name || "센터";
    document.title = (p.name || "센터") + " · 센터 소개";
    if(p.logo && /^data:image\//.test(p.logo)){ var im = new Image(); im.alt = (p.name || "센터") + " 로고"; im.src = p.logo; $("logo").appendChild(im); $("logo").hidden = false; }
    if(p.kind){ $("kind").textContent = p.kind; $("kind").hidden = false; }
    if(p.intro){ $("intro").textContent = p.intro; $("intro").hidden = false; }
    var n = 0;
    if(p.phone){ $("btnTel").href = "tel:" + p.phone; $("btnTel").hidden = false; n++; $("btnTel").addEventListener("click", function(){ hit("call"); }); }
    if(p.book && /^https?:\/\//i.test(p.book)){ $("btnBook").href = p.book; $("btnBook").hidden = false; n++; $("btnBook").addEventListener("click", function(){ hit("book"); }); }
    if(n === 1) $("acts").className = "acts one";
    if(n === 0) $("acts").hidden = true;
    if(p.tags && p.tags.length){ p.tags.forEach(function(t){ $("tags").appendChild(li(t)); }); $("tagCard").hidden = false; }
    ((p.items && p.items.length) ? p.items : DEF_ITEMS).forEach(function(t){ $("items").appendChild(li(t)); });
    var dl = $("info"), rows = 0;
    var add = function(k, v, link){
      if(!v) return; var dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = k; dd.textContent = v;
      if(link){ var a = document.createElement("a"); a.href = link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "지도"; dd.appendChild(a); }
      dl.appendChild(dt); dl.appendChild(dd); rows++;
    };
    add("주소", p.address, p.address ? "https://map.naver.com/p/search/" + encodeURIComponent(p.address) : "");
    add("운영 시간", p.hours);
    add("문의", p.contact);
    $("infoCard").hidden = !rows;
    show("ok");
  }).catch(function(){ $("goneD").textContent = "인터넷 연결을 확인하고 다시 열어 주세요."; show("gone"); });
})();
</script>
</body>
</html>
